[project]
name = "yeoun-server"
version = "0.1.0"
description = "여운 API 서버 — 소중한 사람의 실제 목소리 녹음을 정리하고 원본 클립으로 대답한다"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "argon2-cffi>=23.1",
  "cryptography>=43",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pillow>=10.4",
  "pillow-heif>=0.18",
  "numpy>=1.26",
  "anthropic>=1.0",
]

[project.optional-dependencies]
# 형태소 분석기(메모리 약 350MB). Render 무료(512MB)에서는 끄고 lite 토크나이저를 쓴다.
kiwi = ["kiwipiepy>=0.20"]
# S3 호환 저장소(Cloudflare R2 등)
s3 = ["boto3>=1.34"]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["app/schemas/generated.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
  "E501",  # 줄 길이는 ruff format이 맞춘다 (긴 한국어 문자열은 허용)
  "S101",  # assert는 테스트에서 씀
  "S311",  # 보안 용도가 아닌 random
  "B008",  # FastAPI Depends 기본값
  "S603", "S607",  # ffmpeg subprocess (인자 목록으로만 호출)
  "UP007", "UP045",  # Optional 표기 허용
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"app/schemas/generated.py" = ["E501", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app"]
