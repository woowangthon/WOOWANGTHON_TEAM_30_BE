# 여운 BE — Render Blueprint (AI 우왕톤 팀 30)
# Render 대시보드 → New → Blueprint → 이 저장소(woowangthon/WOOWANGTHON_TEAM_30_BE)를 고르면
# 아래 API 서비스 1개가 무료 등급으로 만들어진다.
#   - yeoun-team30-api : FastAPI (Docker, ffmpeg 포함). 실행되는 AI 코드도 이 안에서 돈다.
# 화면(Next.js)은 FE 저장소(woowangthon/WOOWANGTHON_TEAM_30_FE)에서 따로 배포한다.
#   FE의 YEOUN_API_ORIGIN에 이 서비스 주소를 넣으면, 브라우저의 /api 요청이 FE를 거쳐 여기로 온다.
# DB는 Render가 아니라 Neon 무료 PostgreSQL을 쓴다(YEOUN_DATABASE_URL에 직접 넣음).
#   - Render 무료 DB는 30일 뒤 만료되지만 Neon 무료 DB는 만료가 없어 심사 기간(~11/21)까지 안전하다.
# 자세한 순서와 넣을 값: docs/DEPLOY.md
#
# 무료 등급 제약에 맞춘 설정:
#   - 15분 동안 요청이 없으면 잠든다 → 웹은 시작할 때 API를 깨우고, 화면은 최대 2분 자동 재시도
#   - 영구 디스크가 없다 → 파일은 DB에 암호화 저장(YEOUN_STORAGE=db), 파일·공간 용량 상한
#   - 메모리 512MB → 형태소 분석기 대신 가벼운 lite 토크나이저
#   - 백그라운드 워커가 없다 → API 프로세스 안에서 처리(YEOUN_WORKER_INLINE=true)

services:
  - type: web
    name: yeoun-team30-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Neon 연결 주소 (Connection pooling 끈 직접 연결, ...?sslmode=require 포함). 서버가 postgresql+psycopg://로 바꿔 읽는다 (필수)
      - key: YEOUN_DATABASE_URL
        sync: false
      - key: YEOUN_ENV
        value: staging
      - key: YEOUN_STORAGE
        value: db
      - key: YEOUN_WORKER_INLINE
        value: "true"
      - key: YEOUN_TOKENIZER
        value: lite
      - key: YEOUN_MAX_FILE_MB
        value: "25"
      - key: YEOUN_SPACE_QUOTA_MB
        value: "150"
      - key: YEOUN_USER_UPLOAD_QUOTA_MB
        value: "300"
      - key: YEOUN_CHAT_DAILY_LIMIT
        value: "150"
      - key: YEOUN_SAMPLE_CHAT_PER_MINUTE
        value: "60"
      # 비밀 값: Render가 무작위로 만든다. 마스터 키를 바꾸거나 잃으면 저장된 파일을 읽을 수 없다.
      - key: YEOUN_MASTER_KEY
        generateValue: true
      - key: YEOUN_SESSION_SECRET
        generateValue: true
      # 대시보드에서 직접 넣는 값 (sync: false)
      - key: YEOUN_INVITE_CODES # 친구에게 나눠 줄 초대 코드, 쉼표로 여러 개 (필수)
        sync: false
      - key: YEOUN_PUBLIC_WEB_URL # FE 배포 주소(예: https://yeoun-team30-web.onrender.com). 녹음·초대 링크에 쓴다. 비우면 브라우저 주소 (권장)
        sync: false
      - key: YEOUN_ANTHROPIC_API_KEY # 선택: 클립 고르기·태깅 (기본 모델 claude-haiku-5-5)
        sync: false
      - key: YEOUN_OPENAI_API_KEY # 선택: 음성 인식(whisper)·화자 분리·임베딩
        sync: false
      - key: YEOUN_GEMINI_API_KEY # 선택: 무료 등급은 동의한 사용자에게만 쓴다
        sync: false
