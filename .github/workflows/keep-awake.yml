# 심사 기간(11/15~11/21 본선) 동안 Render 무료 서비스가 잠들지 않게 10분마다 깨운다.
# Render 무료 등급은 15분 동안 요청이 없으면 잠들고, 다시 깨는 데 1분쯤 걸린다.
# 무료 사용 시간(작업 공간당 한 달 750시간)을 아끼려고 2026-11-21 23:59(KST)가 지나면 아무것도 하지 않는다.
# 끝난 뒤에는 이 파일을 지우거나 Actions에서 꺼도 된다.
name: keep-awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API and web until 2026-11-21 (KST)
        run: |
          if [ "$(date -u +%s)" -gt "$(date -u -d '2026-11-21T14:59:59Z' +%s)" ]; then
            echo "심사 기간이 끝나 깨우지 않습니다."; exit 0
          fi
          for url in https://yeoun-team30-api.onrender.com/api/health https://yeoun-team30-web.onrender.com/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "$url" || echo 000)
            echo "$url -> $code"
          done
